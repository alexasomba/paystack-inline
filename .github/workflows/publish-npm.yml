name: Publish npm Package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --lockfile=false

      - name: Check
        run: pnpm exec vp check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Lint package metadata
        run: pnpm run lint:package

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.18.0

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'if (process.env.RELEASE_TAG !== `v${JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version}`) process.exit(1)'

      - name: Check published version
        id: published
        shell: bash
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "package=$name@$version"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already published; skipping npm publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with provenance
        if: steps.published.outputs.exists != 'true'
        run: npm publish --access public
